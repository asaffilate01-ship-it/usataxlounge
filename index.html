    <!-- FAQ Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is an IRS Enrolled Agent?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An Enrolled Agent (EA) is a federally-authorized tax practitioner empowered by the US Department of the Treasury to represent taxpayers before the IRS."
          }
        },
        {
          "@type": "Question",
          "name": "Do US citizens living abroad need to file taxes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, US citizens and green card holders must file US tax returns regardless of where they live. TaxCenda specializes in expat tax filing including FBAR, FATCA, and Foreign Earned Income Exclusion."
          }
        },
        {
          "@type": "Question",
          "name": "What tax forms does TaxCenda handle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TaxCenda handles all individual forms (1040, 1040-SR, 1040-NR, 1040-X), business forms (1120, 1120-S, 1065), international forms (FBAR, FATCA, Form 2555, 1116), estate and gift forms (706, 709, 1041), and all related schedules."
          }
        }
      ]
    }
    </script>

    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: linear-gradient(160deg, #0b1220 0%, #16203a 55%, #12304a 100%);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        transition: opacity 0.35s ease;
        padding-bottom: env(safe-area-inset-bottom);
      }
      html:not(.dark) #app-splash {
        background: linear-gradient(160deg, #ffffff 0%, #f3f6fa 60%, #e8f5f2 100%);
      }
      #app-splash .splash-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 0.5px;
        color: #fff;
        background: linear-gradient(135deg, #17b3a0 0%, #1e63d0 100%);
        box-shadow: 0 14px 34px -12px rgba(23, 179, 160, 0.65);
        animation: splash-float 1.8s ease-in-out infinite;
      }
      #app-splash .splash-word {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #f4f7fb;
      }
      html:not(.dark) #app-splash .splash-word { color: #16203a; }
      #app-splash .splash-tag {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(244, 247, 251, 0.55);
      }
      html:not(.dark) #app-splash .splash-tag { color: rgba(22, 32, 58, 0.55); }
      #app-splash .splash-bar {
        width: 132px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(127, 156, 190, 0.25);
      }
      #app-splash .splash-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #17b3a0, #1e63d0);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes splash-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-mark, #app-splash .splash-bar span { animation: none; }
      }
    </style>
    <div id="app-splash">

      </div>
      <div class="splash-bar"><span></span></div>
