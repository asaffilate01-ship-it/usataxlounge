name: TaxCenda application quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: taxcenda-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"
      - name: Install dependencies using the current Bun lockfile
        run: bun install --frozen-lockfile
      - name: Typecheck app
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Run unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Set up Deno for provider-independent Edge tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Checkout origin and account ownership
        run: deno test supabase/functions/_shared/paymentSecurity.test.ts
